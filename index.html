<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A1633'/%3E%3Cpath d='M12 10l-5 6 5 6M20 10l5 6-5 6' stroke='%2338CDEB' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='1.6' fill='%23FBC556'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="منصة أستاذ المعلوماتية التعليمية — فضاء عربي آمن ينشر فيه التلاميذ مقالاتهم ومشاريعهم ويجتازون الامتحانات الإلكترونية بتصحيح فوري."
    />
    <title>منصة أستاذ المعلوماتية التعليمية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* شبكة أمان: تعرض تشخيصًا واضحًا بدل الشاشة البيضاء إذا تعذّر تشغيل التطبيق */
      window.__bootErrors = [];
      window.addEventListener("error", function (e) {
        window.__bootErrors.push((e.message || "") + (e.filename ? " @ " + e.filename : ""));
      });
      setTimeout(function () {
        if (window.__APP_MOUNTED__) return;
        var root = document.getElementById("root");
        if (!root || root.children.length > 1) return;
        var msg = window.__bootErrors.length
          ? window.__bootErrors.slice(0, 3).join("\n")
          : "تعذّر تحميل ملفات التطبيق أو اكتمال الإقلاع.";
        root.innerHTML =
          '<div dir="rtl" style="min-height:100vh;display:grid;place-items:center;background:#f2f5fb;font-family:system-ui,sans-serif;padding:16px">' +
          '<div style="max-width:560px;width:100%;background:#fff;border:1px solid #ccd5ec;border-radius:16px;padding:32px;text-align:center">' +
          '<div style="font-size:40px">⚠️</div>' +
          '<h1 style="font-size:20px;font-weight:800;color:#0a1633;margin-top:8px">تعذّر تشغيل المنصة</h1>' +
          '<p style="color:#4a5f9e;line-height:1.9;margin-top:8px">حدث خلل عند إقلاع التطبيق. التفاصيل التقنية أدناه — جرّب إعادة التحميل أو فتح الصفحة في نافذة جديدة.</p>' +
          '<pre dir="ltr" style="text-align:left;background:#0a1633;color:#7de3f6;border-radius:10px;padding:14px;font-size:12px;overflow-x:auto;margin-top:16px;white-space:pre-wrap">' +
          msg.replace(/</g, "&lt;") +
          "</pre>" +
          '<button onclick="location.reload()" style="margin-top:20px;height:44px;padding:0 28px;border-radius:10px;border:none;background:#4353c4;color:#fff;font-weight:700;font-size:15px;cursor:pointer">إعادة التحميل</button>' +
          "</div></div>";
      }, 6000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
